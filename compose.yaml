x-app-environment: &app-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-api_usage}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-api_usage}
  TZ: UTC

services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-api_usage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:-api_usage}
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql

  migrate:
    build:
      context: .
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-environment
    restart: "no"

  app:
    build:
      context: .
      target: runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-environment
      API_KEY_PEPPER: ${API_KEY_PEPPER:?API_KEY_PEPPER is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
      NODE_ENV: production
      PORT: 3000
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      SYSTEM_ADMIN_TOKEN: ${SYSTEM_ADMIN_TOKEN:?SYSTEM_ADMIN_TOKEN is required}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(r.status!==200)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    init: true
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  postgres-data:
