name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/api_usage_test
  NODE_VERSION: 24.16.0

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: npm
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global npm@11.13.0
      - run: npm ci
      - run: npm run audit:runtime
      - run: npm run audit:all
      - run: npm run prisma:generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:scripts
      - run: npm run docs:check
      - run: npm run openapi:check
      - run: npm run build

  postgres-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_DB: api_usage_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d api_usage_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: npm
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global npm@11.13.0
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy
      - run: npm run test:integration
      - run: npm run test:e2e
      - run: npm run test:concurrency
      - run: npm run test:contract
      - run: npm run test:security

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci-database-password
      SWAGGER_ENABLED: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: npm
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global npm@11.13.0
      - run: npm ci
      - run: npm run prisma:generate
      - name: Generate ephemeral Compose secrets
        shell: bash
        run: |
          admin="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')"
          metrics="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')"
          pepper="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')"
          printf '::add-mask::%s\n' "$admin" "$metrics" "$pepper"
          printf 'SYSTEM_ADMIN_TOKEN=%s\nMETRICS_TOKEN=%s\nAPI_KEY_PEPPER=%s\n' "$admin" "$metrics" "$pepper" >> "$GITHUB_ENV"
      - run: docker build --target runtime --tag api-usage-quota:${{ github.sha }} .
      - name: Verify runtime hardening
        run: >-
          docker run --rm --entrypoint node api-usage-quota:${{ github.sha }} -e
          "const fs=require('fs'); if (process.getuid?.()===0) process.exit(1); for (const p of ['prisma','typescript']) if (fs.existsSync('/app/node_modules/'+p)) process.exit(2)"
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - run: npm run test:smoke
      - name: Compose cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans
